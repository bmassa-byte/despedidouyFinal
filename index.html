    <!-- =========================================================
         ATRIBUCIÓN GOOGLE ADS
         Guarda:
         - GCLID
         - ID de campaña
         - ID del anuncio
         - Palabra clave
         - Número de consulta
         ========================================================= -->
    <script>
      (function () {
        try {
          // Lee los parámetros que llegan en la URL
          const params = new URLSearchParams(window.location.search);

          // GCLID generado automáticamente por Google Ads
          const gclid = params.get('gclid') || '';

          // Campaña:
          // acepta tanto "campaignid" como el antiguo "utm_campaign"
          const campana =
            params.get('campaignid') ||
            params.get('utm_campaign') ||
            '';

          // Anuncio:
          // acepta tanto "creative" como el antiguo "utm_content"
          const anuncio =
            params.get('creative') ||
            params.get('utm_content') ||
            '';

          // Palabra clave:
          // acepta tanto "keyword" como el antiguo "utm_term"
          const kw =
            params.get('keyword') ||
            params.get('utm_term') ||
            '';

          // Recuperamos datos anteriores, si existen
          const raw = localStorage.getItem('gclid_data');

          let existing = {};

          if (raw) {
            try {
              existing = JSON.parse(raw);
            } catch (e) {
              console.warn(
                'No se pudieron leer los datos anteriores de Google Ads:',
                e
              );
            }
          }

          // Solo actualizamos localStorage cuando realmente
          // llega información de atribución en la URL
          if (gclid || campana || anuncio || kw) {

            // Conservamos el mismo número de consulta si ya existe.
            // Si no existe, generamos uno nuevo de 8 dígitos.
            const refId =
              existing.refId ||
              Math.floor(
                10000000 + Math.random() * 90000000
              ).toString();

            const data = {
              // GCLID
              gclid:
                gclid ||
                existing.gclid ||
                '',

              // Fecha/hora en la que se actualizaron los datos
              ts: Date.now(),

              // Número de consulta
              refId: refId,

              // ID de campaña
              campana:
                campana ||
                existing.campana ||
                '',

              // ID del anuncio
              anuncio:
                anuncio ||
                existing.anuncio ||
                '',

              // Palabra clave
              kw:
                kw ||
                existing.kw ||
                ''
            };

            // Guardamos todo junto
            localStorage.setItem(
              'gclid_data',
              JSON.stringify(data)
            );

            // Esto nos servirá para hacer pruebas
            // desde la consola del navegador
            console.log(
              'Datos Google Ads guardados:',
              data
            );
          }

        } catch (error) {
          console.error(
            'Error guardando atribución Google Ads:',
            error
          );
        }
      })();
    </script>
