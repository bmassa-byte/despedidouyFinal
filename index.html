<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DespedidoUy - Abogados Laborales</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-16641762776"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag('js', new Date());
      gtag('config', 'AW-16641762776');
    </script>

    <!-- Guarda el GCLID para atribución -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var gclid = params.get('gclid');

        if (gclid) {
          localStorage.setItem(
            'gclid_data',
            JSON.stringify({
              gclid: gclid,
              ts: Date.now()
            })
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
